org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# AGP 9.x default-behavior opt-outs, landed alongside the AGP 8.7.3 -> 9.1.1 bump
# to isolate that version change from these separate behavior changes. Revisit and
# remove these one at a time in a later cleanup pass (see Phase 4 of
# ~/docs/agp-gradle9-migration-plan.md) -- do not flip them all at once.
# Note: android.useAndroidx (lowercase x) is a distinct AGP 9 flag from the existing
# android.useAndroidX above; this repo is already on AndroidX, so it is deliberately
# NOT set to false here (that would contradict the existing useAndroidX=true).
android.newDsl=false
android.builtInKotlin=false
android.default.androidx.test.runner=false
android.dependency.useConstraints=true
android.enableAppCompileTimeRClass=false
