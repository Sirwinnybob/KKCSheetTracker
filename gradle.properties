org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# AGP 9.x default-behavior opt-outs. Of the original 8 opt-outs landed with the
# AGP 8.7.3 -> 9.1.1 bump, 6 have been verified safe and removed (see git log on
# this file / ~/docs/agp-gradle9-migration-plan.md Phase 4). These 2 remain,
# coupled: newDsl=true (the AGP 9 default) is incompatible with explicitly
# applying the org.jetbrains.kotlin.android plugin (confirmed by trying it --
# fails with "not compatible with AGP's 9.0 new DSL"). Moving off both requires
# migrating to AGP's built-in Kotlin support and removing that plugin
# application -- a deliberate, separate follow-up project, not a flag flip.
android.newDsl=false
android.builtInKotlin=false
