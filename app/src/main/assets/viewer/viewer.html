<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KKC 3D Viewer</title>
    <link rel="stylesheet" href="css/viewer.css">
    <style>
        #mini-ui {
            position: fixed;
            top: 8px;
            left: 8px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        #room-switcher-mini {
            display: none;
        }
        #room-switcher-mini label {
            font-size: 11px;
            font-weight: 600;
            opacity: 0.7;
            display: block;
            margin-bottom: 3px;
        }
        /* Vertical sliding-pill selector: a track holding stacked buttons, with one pill that
           slides between them (positioned/animated from viewer.js). Colors come from CSS vars
           that viewer.js sets from the app theme (t/tb/tt/p/pb/pt URL params). */
        #room-list-ui {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 4px;
            border-radius: 9px;
            background: var(--room-track, rgba(40,40,40,0.85));
            border: 1px solid var(--room-track-border, rgba(128,128,128,0.4));
            box-shadow: 0 2px 6px rgba(0,0,0,0.25);
        }
        /* Slides with `top`/`height` on the main thread, NOT a transform: on Android WebView a
           transform transition promotes the pill to its own layer, and that layer was not painted
           for the first ~120ms of the slide (pill vanished, then popped in mid-way). This is safe
           because viewer.js starts the heavy model load only after the slide has finished, so the
           main thread is idle while it animates. */
        #room-pill {
            position: absolute;
            top: 0;
            left: 4px;
            width: calc(100% - 8px);
            border-radius: 6px;
            background: var(--room-pill, #1976d2);
            border: 1px solid var(--room-pill-border, transparent);
            box-sizing: border-box;
            pointer-events: none;
            z-index: 0;
        }
        #room-pill.animate {
            transition: top 380ms cubic-bezier(0.4, 0, 0.2, 1), height 380ms cubic-bezier(0.4, 0, 0.2, 1);
        }
        .room-switcher-btn {
            position: relative;
            z-index: 1;
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            background: transparent;
            color: var(--room-track-text, #ddd);
            cursor: pointer;
            font-weight: 700;
            font-size: 12px;
            text-align: left;
            white-space: nowrap;
            min-width: 80px;
        }
        /* Color only -- a heavier weight on the active label widened the widest row and made the
           whole list (and the pill's width) jump on every switch. */
        .room-switcher-btn.active {
            color: var(--room-pill-text, #fff);
        }
    </style>
</head>
<body>
    <div id="mini-ui">
        <div id="room-switcher-mini">
            <label>Room:</label>
            <div id="room-list-ui"></div>
        </div>
    </div>

    <div id="status" role="status" aria-live="polite">
        <span class="status-spin"></span>
        <span id="status-text">Initializing 3D...</span>
    </div>

    <!-- Zoom Joystick -->
    <div id="joystick-container">
        <div id="joystick-track"></div>
        <div id="joystick-handle" role="slider" aria-label="Zoom joystick handle" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" tabindex="0"></div>
        <div class="joystick-label">Zoom</div>
    </div>

    <div id="canvas-container" tabindex="-1"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "./js/three.module.js",
            "three/addons/": "./js/three-addons/"
        }
    }
    </script>
    <script type="module" src="js/viewer.js"></script>
</body>
</html>
